# Supabase project config (used by CLI for migrations, functions, etc.)
# See: https://supabase.com/docs/guides/functions/function-configuration

# Expose crm so PostgREST / supabase-js .schema('crm') can read tax_rate_standard.
# Hosted projects: also add "crm" under Project Settings → API → Exposed schemas.
[api]
schemas = ["public", "graphql_public", "crm"]

# Gemini: require valid Supabase user JWT at gateway; function double-checks via auth.getUser().
# Optional secret GEMINI_PROXY_ALLOWED_ORIGINS=comma-separated origins (else *). Redeploy: supabase functions deploy gemini-proxy
[functions.gemini-proxy]
verify_jwt = true

# Invitation email: JWT required; function verifies invitation row + inviter (see index.ts).
# Redeploy: supabase functions deploy send-invitation-email
[functions.send-invitation-email]
verify_jwt = true
