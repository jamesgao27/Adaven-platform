project_id = "xvqlqvtfogxkfeillvig"

# Expose crm, provider, consumer so PostgREST / supabase-js .schema('crm'|'provider'|'consumer') work.
[api]
enabled = true
schemas = ["public", "graphql_public", "crm", "provider", "consumer"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "https://portalflow.pages.dev"
additional_redirect_urls = [
  "https://portalflow.pages.dev/**",
  "https://portalflow.pages.dev/auth/confirm",
  "https://portalflow.aim.link/**",
  "https://portalflow.aim.link/auth/confirm",
  "exp://localhost:8081/**",
  "exp://localhost:8081/--/auth/confirm",
  "portalflow://**",
  "portalflow://auth/confirm",
  "http://localhost:8081/**",
  "http://localhost:8081/auth/confirm",
  "https://receiptap.pages.dev/**",
  "https://receiptap.pages.dev/auth/confirm",
  "https://receiptap.aim.link/**",
  "https://receiptap.aim.link/auth/confirm",
  "receiptap://**",
  "receiptap://auth/confirm"
]

[auth.email]
otp_length = 6

[auth.email.template.confirmation]
subject = "Confirm your email for Portalflow"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirm your new Portalflow email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.recovery]
subject = "Reset your Portalflow password"
content_path = "./supabase/templates/recovery.html"

# Gemini: require valid Supabase user JWT at gateway; function double-checks via auth.getUser().
# Optional secret GEMINI_PROXY_ALLOWED_ORIGINS=comma-separated origins (else *). Redeploy: supabase functions deploy gemini-proxy
[functions.gemini-proxy]
verify_jwt = true

# Invitation email: JWT required; function verifies invitation row + inviter (see index.ts).
# Redeploy: supabase functions deploy send-invitation-email
[functions.send-invitation-email]
verify_jwt = true

# Invite registration: invitation row is the auth gate (anonymous invitees).
[functions.register-with-invitation]
verify_jwt = false
