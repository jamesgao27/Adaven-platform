project_id = "foyecolycmxcneflpant"

# Expose provider, consumer, crm so PostgREST / supabase-js .schema() and Hub product-ops work.
[api]
enabled = true
schemas = ["public", "graphql_public", "provider", "consumer", "crm"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "https://wholestore.pages.dev/auth/confirm"
additional_redirect_urls = [
  "https://wholestore.pages.dev/**",
  "https://wholestore.pages.dev/auth/confirm",
  "https://wholestore.app/**",
  "https://wholestore.app/auth/confirm",
  "http://localhost:8081/**",
  "http://localhost:8081/auth/confirm",
  "http://localhost:8081/invite/**",
  "exp://localhost:8081/**",
  "exp://localhost:8081/--/auth/confirm",
  "wholestore://**",
  "wholestore://auth/confirm",
  "wholestore://invite/**"
]

[auth.email]
otp_length = 6

# Same layout as Portalflow. Product name is Wholestore.
[auth.email.template.confirmation]
subject = "Confirm your email for Wholestore"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirm your new Wholestore email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You are invited to Wholestore"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Wholestore verification code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.reauthentication]
subject = "Your Wholestore verification code"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.template.recovery]
subject = "Reset your Wholestore password"
content_path = "./supabase/templates/recovery.html"

# Invitation email: JWT required; function verifies invitation row + inviter.
# Redeploy: supabase functions deploy send-invitation-email --project-ref foyecolycmxcneflpant
[functions.send-invitation-email]
verify_jwt = true

# Invite registration: invitation row is the auth gate (anonymous invitees).
[functions.register-with-invitation]
verify_jwt = false
