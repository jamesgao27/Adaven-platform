# Receiptap web is a second export of apps/portalflow-app (APP_VARIANT=receiptap).
# Pages project `receiptap`. Custom domain receiptap.aim.link is attached in
# Cloudflare by hand. Same Supabase as Portalflow. A portalflow-app push ships
# both webs because they share this tree. Kernel-only pushes still ship neither.
name: Deploy Receiptap Web

on:
  push:
    branches: [main]
    paths:
      - "apps/portalflow-app/**"
      - ".github/workflows/deploy-receiptap-web.yml"
      - ".github/workflows/deploy-web-reusable.yml"
  workflow_dispatch:

concurrency:
  group: deploy-receiptap-web
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-web-reusable.yml
    with:
      app_dir: apps/portalflow-app
      project_name: receiptap
      account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      app_variant: receiptap
    secrets:
      expo_public_supabase_url: ${{ secrets.PORTALFLOW_EXPO_PUBLIC_SUPABASE_URL }}
      expo_public_supabase_anon_key: ${{ secrets.PORTALFLOW_EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
